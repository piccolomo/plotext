name: Build & publish wheels

# Builds wheels for Linux x86_64+aarch64, macOS x86_64+arm64, Windows AMD64,
# plus the sdist, and publishes them to PyPI when a `v*` tag is pushed.
#
# Trusted Publishing (https://docs.pypi.org/trusted-publishers/) is used —
# no API token in repo secrets. One-time setup on PyPI: register this repo
# as a Trusted Publisher under the `plotext` project. Match `owner` =
# piccolomo, `repo` = plotext, `workflow` = wheels.yml, `environment` = pypi.

on:
  push:
    tags:
      - 'v*'          # both spellings, the version 5 tags carrying no letter
      - '[0-9]*'
  pull_request:
    paths:
      - 'plotext/_kernel/cpp/**'
      - 'build_cpp.py'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # cibuildwheel uses QEMU under the hood to build aarch64 Linux wheels on
      # an x86_64 runner. The action below registers it once per job.
      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish when a tag is pushed, not on pull requests nor on manual runs.
    if: startsWith(github.ref, 'refs/tags/')          # any tag publishes, with or without the leading letter
    environment:
      name: pypi
      url: https://pypi.org/p/plotext
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
