# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py

# Install sphinx extensions and plotext itself.
# Installing plotext runs setup.py's custom build_py, which compiles the
# C++ kernel (kernel.so) — required because docs/source/api.rst uses
# autofunction:: directives that import plotext.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
